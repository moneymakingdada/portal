version: "1"
projects:
- name: Project 2
  environments:
  - name: Production
    services:
    - type: web
      name: portal
      runtime: python
      repo: https://github.com/moneymakingdada/portal
      plan: free
      envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SIGNUP_SMS_DAILY_CAP
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: TRUSTED_PROXY_COUNT
        sync: false
      - key: DEFAULT_PRICE_PER_SEGMENT_PESEWAS
        sync: false
      - key: SIGNUP_BONUS_PESEWAS
        sync: false
      - key: TOPUP_MAX_PESEWAS
        sync: false
      - key: TOPUP_MIN_PESEWAS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ARKESEL_DLR_SECRET
        sync: false
      - key: ARKESEL_SANDBOX
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: SMS_BACKEND
        sync: false
      - key: DEFAULT_SENDER_ID
        sync: false
      - key: APP_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OTP_HMAC_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        sync: false
      region: oregon
      buildCommand: pip install -r requirements.txt
      startCommand: gunicorn config.wsgi:application
      autoDeployTrigger: commit
      rootDir: backend/
    databases:
    - name: portal-db
      databaseName: portal_jg3m
      user: portal_jg3m_user
      plan: free
      region: oregon
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"
