      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"


  # The frontend, as a Render Static Site - an alternative to deploying
  # frontend/ on Vercel. Same reasoning as vercel.json: this app is built
  # same-origin on purpose (no CORS, cookies just work), so the rewrite
  # below proxies /api/* straight through to portal-backend instead of
  # sending the browser to a different domain. A static site also has no
  # free-tier spin-down the way portal-backend does, since there's no
  # process to sleep - it's just files served from Render's CDN.
  - type: web
    name: portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://portal-e8k3.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html