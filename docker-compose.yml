# Local development services:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kodo
      POSTGRES_USER: kodo
      POSTGRES_PASSWORD: kodo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
